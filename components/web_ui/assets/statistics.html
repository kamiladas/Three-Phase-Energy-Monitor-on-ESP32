<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statystyki</title><style>
:root{--g:#4caf50;--nav:#303332;--bg:#f1f3f1;--muted:#68716b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",sans-serif;color:#202522}nav{height:54px;background:var(--nav);color:#fff;padding:17px max(20px,calc((100% - 1120px)/2))}nav a{color:#fff;text-decoration:none;margin-left:28px}.hero{background:linear-gradient(145deg,#4caf50,#388e3c);color:#fff;padding:38px 20px 72px}.inner,main{max-width:1120px;margin:auto}.hero h1{font-size:2.6rem;margin:.15em 0}.card{background:#fff;border-radius:14px;box-shadow:0 8px 24px #1a30211c;padding:22px}.main{margin-top:-44px}.bar{display:flex;flex-wrap:wrap;gap:20px;align-items:end}label small{display:block;color:var(--muted);font-weight:700;margin-bottom:5px}select{padding:9px;border:1px solid #dce3dd;border-radius:7px;background:#fff}.phases label{margin-right:14px;font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.summary div{border:1px solid #e4e9e5;padding:15px;border-radius:9px}.summary small{display:block;color:var(--muted)}.summary b{font-size:1.4rem}canvas{width:100%;height:350px;border:1px solid #e3e8e4;border-radius:8px}.legend{color:var(--muted);margin:10px 0}.legend span{margin-right:18px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.meta,.events{display:flex;justify-content:space-between;color:var(--muted);margin-top:10px}.events .card{flex:1;margin:12px 6px}.events h2{color:#202522}@media(max-width:650px){.summary{grid-template-columns:1fr 1fr}.events{display:block}canvas{height:280px}}
</style></head><body><nav><b>ENERGY MONITOR</b><span style="float:right"><a href="/">Pomiary</a><a href="/statistics">Statystyki</a></span></nav><header class="hero"><div class="inner"><small>HISTORIA I OSCYLOSKOP</small><h1>Statystyki gospodarstwa</h1><div>Pełna doba profilu w cztery minuty symulatora</div></div></header><main><section class="card main"><div class="bar"><label><small>PARAMETR</small><select id="metric"><option value="active_power_w">Moc czynna P [W]</option><option value="apparent_power_va">Moc pozorna S [VA]</option><option value="reactive_power_var">Moc bierna Q [var]</option><option value="voltage_v">Napięcie RMS [V]</option><option value="current_a">Prąd RMS [A]</option><option value="power_factor">Współczynnik mocy PF</option><option value="frequency_hz">Częstotliwość + przebieg sygnału [Hz]</option><option value="imported_energy_wh">Energia pobrana [Wh]</option><option value="exported_energy_wh">Energia oddana [Wh]</option></select></label><div class="phases"><small>FAZY</small><label><input type="checkbox" data-p="0" checked>L1</label><label><input type="checkbox" data-p="1" checked>L2</label><label><input type="checkbox" data-p="2" checked>L3</label></div></div><div class="summary"><div><small>Minimum</small><b id="min">—</b></div><div><small>Średnia</small><b id="avg">—</b></div><div><small>Maksimum</small><b id="max">—</b></div><div><small>Ostatnia</small><b id="last">—</b></div></div><div class="legend"><span><i style="background:#35a853"></i>L1</span><span><i style="background:#d89b19"></i>L2</span><span><i style="background:#7957b8"></i>L3</span></div><canvas id="chart" width="1040" height="350"></canvas><div class="meta"><span id="caption">Historia pomiarów</span><span id="count">Ładowanie…</span></div></section><section class="events"><div class="card">Punkty historii<h2 id="points">0 / 240</h2></div><div class="card">Przerwy w próbkach<h2 id="gaps">0</h2></div><div class="card">Flagi jakości<h2 id="flags">0</h2></div></section></main><script>
const C=['#35a853','#d89b19','#7957b8'],U={active_power_w:'W',apparent_power_va:'VA',reactive_power_var:'var',voltage_v:'V',current_a:'A',power_factor:'',frequency_hz:'Hz',imported_energy_wh:'Wh',exported_energy_wh:'Wh'};let H=[],W=[];const M=document.getElementById('metric'),ctx=document.getElementById('chart').getContext('2d');function phases(){return[...document.querySelectorAll('[data-p]')].filter(e=>e.checked).map(e=>+e.dataset.p)}function fmt(v){if(!isFinite(v))return'—';let d=M.value==='power_factor'?3:M.value==='frequency_hz'?2:1;return v.toFixed(d)+' '+U[M.value]}function grid(){let w=ctx.canvas.width,h=ctx.canvas.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e1e7e2';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=15+i*(h-40)/4;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(w-10,y);ctx.stroke()}}function wave(ps){grid();if(W.length<2)return;let avg=[0,1,2].map(n=>W.reduce((s,p)=>s+p.voltage[n],0)/W.length),amp=Math.max(1,...W.flatMap(p=>ps.map(n=>Math.abs(p.voltage[n]-avg[n])))),w=ctx.canvas.width,h=ctx.canvas.height;ps.forEach(n=>{ctx.strokeStyle=C[n];ctx.lineWidth=2.5;ctx.beginPath();W.forEach((p,i)=>{let x=i/(W.length-1)*w,y=h/2-(p.voltage[n]-avg[n])/amp*h*.43;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});document.getElementById('caption').textContent='Rzeczywiste próbki ADC napięcia · około 2 okresy'}function history(ps,key,all){grid();if(H.length<2||!all.length)return;let lo=Math.min(...all),hi=Math.max(...all);if(hi-lo<1e-5)hi=lo+1;let w=ctx.canvas.width,h=ctx.canvas.height;ps.forEach(n=>{ctx.strokeStyle=C[n];ctx.lineWidth=2.5;ctx.beginPath();H.forEach((p,i)=>{let x=45+i/(H.length-1)*(w-60),y=h-25-(p[key][n]-lo)/(hi-lo)*(h-45);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});document.getElementById('caption').textContent='Trend dobowy · dane zachowane w firmware'}function render(){let ps=phases(),key=M.value,all=H.flatMap(p=>ps.map(n=>p[key][n])).filter(isFinite);document.getElementById('min').textContent=fmt(Math.min(...all));document.getElementById('avg').textContent=fmt(all.reduce((a,b)=>a+b,0)/all.length);document.getElementById('max').textContent=fmt(Math.max(...all));document.getElementById('last').textContent=H.length&&ps.length?fmt(H.at(-1)[key][ps[0]]):'—';key==='frequency_hz'?wave(ps):history(ps,key,all);document.getElementById('points').textContent=H.length+' / 240';document.getElementById('count').textContent=H.length+' punktów';document.getElementById('gaps').textContent=H.filter(p=>p.missing_time_us).length;document.getElementById('flags').textContent=H.reduce((s,p)=>s+p.flags.filter(Boolean).length,0)}async function load(){try{let[h,w]=await Promise.all([fetch('/api/v1/history',{cache:'no-store'}),fetch('/api/v1/waveform',{cache:'no-store'})]);H=(await h.json()).points;W=(await w.json()).samples;render()}catch(e){document.getElementById('count').textContent='Błąd API'}}M.onchange=render;document.querySelectorAll('[data-p]').forEach(e=>e.onchange=render);load();setInterval(load,3000);
</script><script>
M.insertAdjacentHTML('afterbegin','<option value="osc_vi">Oscyloskop V + I w czasie</option><option value="osc_current">Oscyloskop prądu</option><option value="osc_voltage">Oscyloskop napięcia</option>');
const baseRender=render,Vscale=[.9888135593,1.03125,.9588135593],Iscale=[.00508410746,.00508410746,.00508410746];
function centered(kind,n){const a=W.map(p=>p[kind][n]),mean=a.reduce((s,v)=>s+v,0)/Math.max(1,a.length),scale=kind==='voltage'?Vscale[n]:Iscale[n];return a.map(v=>(v-mean)*scale)}
function scope(ps,mode){grid();if(W.length<2)return;const w=ctx.canvas.width,h=ctx.canvas.height,V=[0,1,2].map(n=>centered('voltage',n)),I=[0,1,2].map(n=>centered('current',n)),vmax=Math.max(1,...ps.flatMap(n=>V[n].map(Math.abs))),imax=Math.max(.01,...ps.flatMap(n=>I[n].map(Math.abs)));function trace(a,max,n,dash){ctx.strokeStyle=C[n];ctx.lineWidth=dash?1.8:2.7;ctx.setLineDash(dash?[7,5]:[]);ctx.beginPath();a.forEach((v,k)=>{let x=k/(a.length-1)*w,y=h/2-v/max*h*.42;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ps.forEach(n=>{if(mode!=='i')trace(V[n],vmax,n,false);if(mode!=='v')trace(I[n],imax,n,true)});ctx.setLineDash([]);ctx.fillStyle='#68716b';ctx.font='12px Segoe UI';ctx.fillText(mode==='vi'?'V: linia ciągła · I: linia przerywana · niezależne skale':mode==='v'?`Napięcie chwilowe ±${vmax.toFixed(1)} V`:`Prąd chwilowy ±${imax.toFixed(3)} A`,12,20);document.getElementById('caption').textContent='Oscyloskop · rzeczywiste próbki · 40 ms / około 2 okresy'}
render=function(){const key=M.value;if(!key.startsWith('osc_'))return baseRender();const ps=phases(),source=key==='osc_current'?'current_a':'voltage_v',all=H.flatMap(p=>ps.map(n=>p[source][n])).filter(isFinite),old=M.value;document.getElementById('min').textContent=all.length?Math.min(...all).toFixed(3)+' '+(source==='current_a'?'A':'V'):'—';document.getElementById('avg').textContent=all.length?(all.reduce((a,b)=>a+b,0)/all.length).toFixed(3)+' '+(source==='current_a'?'A':'V'):'—';document.getElementById('max').textContent=all.length?Math.max(...all).toFixed(3)+' '+(source==='current_a'?'A':'V'):'—';document.getElementById('last').textContent=H.length&&ps.length?H.at(-1)[source][ps[0]].toFixed(3)+' '+(source==='current_a'?'A':'V'):'—';scope(ps,key==='osc_vi'?'vi':key==='osc_current'?'i':'v');document.getElementById('points').textContent=H.length+' / 240';document.getElementById('count').textContent=W.length+' próbek przebiegu'};
</script><script>
const scopeRender=render;
function powerBars(ps,key){grid();if(!H.length||!ps.length)return;const w=ctx.canvas.width,h=ctx.canvas.height,totals=H.map(p=>ps.reduce((s,n)=>s+Math.max(0,p[key][n]),0)),max=Math.max(1,...totals),bw=Math.max(1,(w-60)/H.length*.82);H.forEach((p,i)=>{let bottom=h-25,x=45+i/(H.length-1||1)*(w-60);ps.forEach(n=>{const value=Math.max(0,p[key][n]),bh=value/max*(h-45);ctx.fillStyle=C[n];ctx.globalAlpha=.82;ctx.fillRect(x-bw/2,bottom-bh,bw,bh);bottom-=bh})});ctx.globalAlpha=1;ctx.fillStyle='#68716b';ctx.font='12px Segoe UI';ctx.fillText('0',18,h-25);ctx.fillText(max.toFixed(0)+' '+U[key],5,17);document.getElementById('caption').textContent='Moc w czasie · słupek = suma · kolor = udział fazy'}
render=function(){const key=M.value;scopeRender();if(['active_power_w','apparent_power_va','reactive_power_var'].includes(key))powerBars(phases(),key)};
</script></body></html>
